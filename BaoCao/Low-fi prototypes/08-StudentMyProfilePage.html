<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Wireframe - Student My Profile Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #e5e5e5; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; font-family: Arial, sans-serif; }
        .wireframe-container { width: 900px; background: #f5f5f5; border: 2px solid #333; }
        .badge { position: absolute; font-size: 12px; font-weight: bold; color: #000; z-index: 100; }

        /* Navbar */
        .navbar { height: 50px; border-bottom: 2px solid #333; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; position: relative; background: #fff; }
        .nav-left { display: flex; align-items: center; gap: 12px; }
        .logo-box { width: 30px; height: 30px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        .logo-text { width: 60px; height: 12px; background: #666; }
        .nav-center { display: flex; gap: 20px; }
        .nav-item { width: 70px; height: 10px; background: #888; }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .icon-circle { width: 22px; height: 22px; border: 2px solid #666; border-radius: 50%; }
        .avatar { width: 28px; height: 28px; border: 2px solid #333; border-radius: 50%; background: #ccc; }

        /* Page Header */
        .page-header { padding: 20px; position: relative; background: #fff; border-bottom: 2px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .page-title { width: 140px; height: 22px; background: #444; margin-bottom: 8px; }
        .page-subtitle { width: 180px; height: 10px; background: #999; }
        .header-btn { width: 130px; height: 36px; border: 2px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-icon { width: 14px; height: 14px; border: 2px solid #666; }
        .btn-text { width: 80px; height: 10px; background: #666; }

        /* Profile Banner */
        .profile-section { position: relative; background: #fff; border-bottom: 2px solid #333; }
        .profile-banner { height: 100px; background: #c0c0c0; }
        .profile-avatar { width: 90px; height: 90px; border: 4px solid #333; border-radius: 50%; background: #fff; position: absolute; top: 55px; left: 40px; overflow: hidden; }
        .profile-avatar::before, .profile-avatar::after { content: ""; position: absolute; background: #999; width: 2px; height: 130%; top: 50%; left: 50%; }
        .profile-avatar::before { transform: translate(-50%, -50%) rotate(45deg); }
        .profile-avatar::after { transform: translate(-50%, -50%) rotate(-45deg); }
        .profile-info { padding: 55px 40px 25px; display: flex; justify-content: space-between; align-items: flex-start; }
        .profile-name { width: 160px; height: 20px; background: #444; margin-bottom: 8px; }
        .profile-email { width: 200px; height: 10px; background: #888; margin-bottom: 12px; }
        .profile-badges { display: flex; gap: 10px; }
        .profile-badge { width: 55px; height: 24px; border: 1px solid #999; border-radius: 12px; }
        .edit-btn { width: 110px; height: 36px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
        .edit-btn-text { width: 70px; height: 10px; background: #fff; }

        /* Content */
        .content { padding: 20px 40px; }

        /* Section Card */
        .section-card { background: #fff; border: 2px solid #333; margin-bottom: 20px; position: relative; padding: 20px; }
        .section-title { width: 140px; height: 16px; background: #444; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-item { position: relative; }
        .form-label { width: 80px; height: 10px; background: #999; margin-bottom: 10px; }
        .form-input { height: 44px; border: 2px solid #333; display: flex; align-items: center; padding: 0 15px; }
        .input-text { width: 150px; height: 12px; background: #555; }

        /* Stats Section */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stat-box { padding: 25px; background: #f0f8f0; border: 2px solid #333; text-align: center; position: relative; }
        .stat-box.orange { background: #fff8f0; }
        .stat-label { width: 50px; height: 10px; background: #888; margin: 0 auto 15px; }
        .stat-value { width: 70px; height: 32px; background: #444; margin: 0 auto; }
        .note-text { width: 280px; height: 10px; background: #aaa; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="wireframe-container">
        <!-- Navbar -->
        <div class="navbar">
            <span class="badge" style="top: 15px; right: 10px;">(1)</span>
            <div class="nav-left">
                <div class="logo-box">X</div>
                <div class="logo-text"></div>
            </div>
            <div class="nav-center">
                <div class="nav-item"></div>
                <div class="nav-item"></div>
                <div class="nav-item"></div>
                <div class="nav-item"></div>
                <div class="nav-item"></div>
            </div>
            <div class="nav-right">
                <div class="icon-circle"></div>
                <div class="avatar"></div>
            </div>
        </div>

        <!-- Page Header -->
        <div class="page-header">
            <span class="badge" style="top: 10px; right: 10px;">(2)</span>
            <div>
                <div class="page-title"></div>
                <div class="page-subtitle"></div>
            </div>
            <div class="header-btn">
                <span class="badge" style="top: -12px; right: -10px;">(2.1)</span>
                <div class="btn-icon"></div>
                <div class="btn-text"></div>
            </div>
        </div>

        <!-- Profile Section with Banner & Avatar -->
        <div class="profile-section">
            <span class="badge" style="top: 10px; right: 10px;">(3)</span>
            <div class="profile-banner"></div>
            <div class="profile-avatar">
                <span class="badge" style="top: -15px; right: -10px;">(3.1)</span>
            </div>
            <div class="profile-info">
                <div>
                    <span class="badge" style="top: -10px; left: 0;">(3.2)</span>
                    <div class="profile-name"></div>
                    <div class="profile-email"></div>
                    <div class="profile-badges">
                        <div class="profile-badge"></div>
                        <div class="profile-badge"></div>
                    </div>
                </div>
                <div class="edit-btn">
                    <span class="badge" style="top: -12px; right: -10px;">(3.3)</span>
                    <div class="edit-btn-text"></div>
                </div>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Thông tin liên hệ -->
            <div class="section-card">
                <span class="badge" style="top: 10px; right: 10px;">(4)</span>
                <div class="section-title"></div>
                <div class="form-grid">
                    <div class="form-item">
                        <span class="badge" style="top: -8px; left: 0;">(4.1)</span>
                        <div class="form-label"></div>
                        <div class="form-input"><div class="input-text"></div></div>
                    </div>
                    <div class="form-item">
                        <span class="badge" style="top: -8px; left: 0;">(4.2)</span>
                        <div class="form-label"></div>
                        <div class="form-input"><div class="input-text"></div></div>
                    </div>
                    <div class="form-item">
                        <span class="badge" style="top: -8px; left: 0;">(4.3)</span>
                        <div class="form-label"></div>
                        <div class="form-input"><div class="input-text"></div></div>
                    </div>
                    <div class="form-item">
                        <span class="badge" style="top: -8px; left: 0;">(4.4)</span>
                        <div class="form-label"></div>
                        <div class="form-input"><div class="input-text"></div></div>
                    </div>
                </div>
            </div>

            <!-- Thông tin ngân hàng -->
            <div class="section-card">
                <span class="badge" style="top: 10px; right: 10px;">(5)</span>
                <div class="section-title"></div>
                <div class="form-grid">
                    <div class="form-item">
                        <span class="badge" style="top: -8px; left: 0;">(5.1)</span>
                        <div class="form-label"></div>
                        <div class="form-input"><div class="input-text"></div></div>
                    </div>
                    <div class="form-item">
                        <span class="badge" style="top: -8px; left: 0;">(5.2)</span>
                        <div class="form-label"></div>
                        <div class="form-input"><div class="input-text"></div></div>
                    </div>
                </div>
            </div>

            <!-- Thông tin học tập -->
            <div class="section-card">
                <span class="badge" style="top: 10px; right: 10px;">(6)</span>
                <div class="section-title"></div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="badge" style="top: 5px; right: 5px;">(6.1)</span>
                        <div class="stat-label"></div>
                        <div class="stat-value"></div>
                    </div>
                    <div class="stat-box orange">
                        <span class="badge" style="top: 5px; right: 5px;">(6.2)</span>
                        <div class="stat-label"></div>
                        <div class="stat-value"></div>
                    </div>
                </div>
                <div class="note-text"></div>
            </div>
        </div>
    </div>
</body>
</html>

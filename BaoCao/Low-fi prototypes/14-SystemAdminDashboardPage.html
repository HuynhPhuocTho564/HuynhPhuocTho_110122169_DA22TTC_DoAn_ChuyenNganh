<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Wireframe - System Admin Dashboard Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #e5e5e5; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; font-family: Arial, sans-serif; }
        .wireframe-container { width: 1100px; background: #fff; border: 2px solid #333; display: flex; }
        .badge { position: absolute; font-size: 12px; font-weight: bold; color: #000; z-index: 100; }
        .sidebar { width: 220px; background: #d0d0d0; border-right: 2px solid #333; position: relative; min-height: 900px; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #999; display: flex; align-items: center; gap: 10px; }
        .sidebar-logo { width: 32px; height: 32px; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .sidebar-title { width: 80px; height: 14px; background: #444; }
        .sidebar-user { padding: 15px; border-bottom: 1px solid #999; display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; border: 2px solid #333; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .user-name { width: 80px; height: 10px; background: #444; margin-bottom: 5px; }
        .user-email { width: 110px; height: 7px; background: #888; }
        .user-badge { width: 70px; height: 16px; background: #666; border-radius: 3px; margin-top: 5px; }
        .sidebar-menu { padding: 10px 0; }
        .menu-item { padding: 12px 15px; display: flex; align-items: center; gap: 10px; }
        .menu-item.active { background: #888; }
        .menu-icon { width: 18px; height: 18px; border: 2px solid #666; }
        .menu-item.active .menu-icon { border-color: #fff; }
        .menu-text { width: 100px; height: 10px; background: #555; }
        .menu-item.active .menu-text { background: #fff; }
        .sidebar-footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 15px; border-top: 1px solid #999; }
        .footer-text { width: 130px; height: 7px; background: #888; margin-bottom: 4px; }
        .main-content { flex: 1; background: #f5f5f5; }
        .topbar { height: 50px; background: #fff; border-bottom: 2px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: relative; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; }
        .breadcrumb-icon { width: 14px; height: 14px; border: 1px solid #888; }
        .breadcrumb-text { width: 60px; height: 8px; background: #888; }
        .topbar-right { display: flex; align-items: center; gap: 15px; }
        .notif-icon { width: 20px; height: 20px; border: 2px solid #666; border-radius: 50%; }
        .topbar-user { display: flex; align-items: center; gap: 8px; }
        .topbar-avatar { width: 28px; height: 28px; border: 2px solid #333; border-radius: 50%; background: #ccc; }
        .topbar-name { width: 70px; height: 10px; background: #666; }
        .content { padding: 20px; }
        .welcome-section { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; position: relative; }
        .welcome-title { width: 280px; height: 24px; background: #444; margin-bottom: 8px; }
        .welcome-subtitle { width: 220px; height: 10px; background: #888; }
        .filters { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding: 15px; background: #fff; border: 2px solid #333; position: relative; }
        .filter-icon { width: 16px; height: 16px; border: 2px solid #888; }
        .filter-label { width: 60px; height: 8px; background: #888; }
        .filter-dropdown { width: 110px; height: 32px; border: 2px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; background: #fff; }
        .dropdown-text { width: 70px; height: 8px; background: #666; }
        .dropdown-arrow { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid #333; }
        .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; position: relative; }
        .stat-card { background: #fff; border: 2px solid #333; border-left: 4px solid #666; padding: 15px; position: relative; }
        .stat-label { width: 70px; height: 8px; background: #999; margin-bottom: 10px; }
        .stat-number { width: 50px; height: 28px; background: #444; }
        .chart-section { background: #fff; border: 2px solid #333; padding: 20px; margin-bottom: 20px; position: relative; }
        .chart-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .chart-icon { width: 18px; height: 18px; border: 2px solid #666; }
        .chart-title { width: 220px; height: 14px; background: #444; }
        .line-chart-area { height: 180px; border: 1px solid #ddd; position: relative; padding: 20px; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-card { background: #fff; border: 2px solid #333; padding: 20px; position: relative; }
        .doughnut-area { height: 180px; display: flex; align-items: center; justify-content: center; }
        .doughnut { width: 140px; height: 140px; border: 20px solid #333; border-radius: 50%; }
        .chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 12px; height: 12px; background: #666; }
        .legend-text { width: 50px; height: 8px; background: #888; }
        .pie-area { height: 180px; display: flex; align-items: center; justify-content: center; }
        .pie { width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(#333 0deg 90deg, #666 90deg 180deg, #999 180deg 270deg, #bbb 270deg 360deg); }
        .table-section { background: #fff; border: 2px solid #333; padding: 20px; position: relative; }
        .table-header { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; padding: 10px; background: #e0e0e0; border: 1px solid #999; margin-bottom: 5px; }
        .table-header-cell { height: 10px; background: #666; }
        .table-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; padding: 12px 10px; border-bottom: 1px solid #ddd; }
        .table-cell { height: 10px; background: #888; }
    </style>
</head>
<body>
    <div class="wireframe-container">
        <div class="sidebar">
            <span class="badge" style="top: 10px; right: 10px;">(1)</span>
            <div class="sidebar-header"><div class="sidebar-logo">X</div><div class="sidebar-title"></div></div>
            <div class="sidebar-user"><div class="user-avatar">X</div><div><div class="user-name"></div><div class="user-email"></div><div class="user-badge"></div></div></div>
            <div class="sidebar-menu"><div class="menu-item active"><div class="menu-icon"></div><div class="menu-text"></div></div><div class="menu-item"><div class="menu-icon"></div><div class="menu-text"></div></div><div class="menu-item"><div class="menu-icon"></div><div class="menu-text"></div></div><div class="menu-item"><div class="menu-icon"></div><div class="menu-text"></div></div><div class="menu-item"><div class="menu-icon"></div><div class="menu-text"></div></div><div class="menu-item"><div class="menu-icon"></div><div class="menu-text"></div></div></div>
            <div class="sidebar-footer"><div class="footer-text"></div><div class="footer-text" style="width: 100px;"></div></div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <span class="badge" style="top: 15px; right: 10px;">(2)</span>
                <div class="breadcrumb"><div class="breadcrumb-icon"></div><div class="breadcrumb-text"></div><span style="color: #888;">/</span><div class="breadcrumb-text"></div></div>
                <div class="topbar-right"><div class="notif-icon"></div><div class="topbar-user"><div class="topbar-avatar"></div><div class="topbar-name"></div></div></div>
            </div>
            <div class="content">
                <div class="welcome-section">
                    <span class="badge" style="top: 0; right: 10px;">(3)</span>
                    <div><div class="welcome-title"></div><div class="welcome-subtitle"></div></div>
                </div>
                <div class="filters">
                    <span class="badge" style="top: 10px; right: 10px;">(4)</span>
                    <div class="filter-icon"></div><div class="filter-label"></div><div class="filter-dropdown"><div class="dropdown-text"></div><div class="dropdown-arrow"></div></div><div class="filter-label"></div><div class="filter-dropdown"><div class="dropdown-text"></div><div class="dropdown-arrow"></div></div>
                </div>
                <div class="stats-row">
                    <div class="stat-card"><span class="badge" style="top: 5px; right: 5px;">(5)</span><div class="stat-label"></div><div class="stat-number"></div></div>
                    <div class="stat-card"><span class="badge" style="top: 5px; right: 5px;">(6)</span><div class="stat-label"></div><div class="stat-number"></div></div>
                    <div class="stat-card"><span class="badge" style="top: 5px; right: 5px;">(7)</span><div class="stat-label"></div><div class="stat-number"></div></div>
                    <div class="stat-card"><span class="badge" style="top: 5px; right: 5px;">(8)</span><div class="stat-label"></div><div class="stat-number"></div></div>
                    <div class="stat-card"><span class="badge" style="top: 5px; right: 5px;">(9)</span><div class="stat-label"></div><div class="stat-number"></div></div>
                </div>
                <div class="chart-section">
                    <span class="badge" style="top: 10px; right: 10px;">(10)</span>
                    <div class="chart-header"><div class="chart-icon"></div><div class="chart-title"></div></div>
                    <div class="line-chart-area"></div>
                </div>
                <div class="charts-grid">
                    <div class="chart-card"><span class="badge" style="top: 10px; right: 10px;">(11)</span><div class="chart-header"><div class="chart-icon"></div><div class="chart-title" style="width: 150px;"></div></div><div class="doughnut-area"><div class="doughnut"></div></div><div class="chart-legend"><div class="legend-item"><div class="legend-color"></div><div class="legend-text"></div></div><div class="legend-item"><div class="legend-color" style="background: #888;"></div><div class="legend-text"></div></div><div class="legend-item"><div class="legend-color" style="background: #aaa;"></div><div class="legend-text"></div></div><div class="legend-item"><div class="legend-color" style="background: #ccc;"></div><div class="legend-text"></div></div></div></div>
                    <div class="chart-card"><span class="badge" style="top: 10px; right: 10px;">(12)</span><div class="chart-header"><div class="chart-icon"></div><div class="chart-title" style="width: 150px;"></div></div><div class="pie-area"><div class="pie"></div></div><div class="chart-legend"><div class="legend-item"><div class="legend-color" style="background: #333;"></div><div class="legend-text"></div></div><div class="legend-item"><div class="legend-color" style="background: #666;"></div><div class="legend-text"></div></div><div class="legend-item"><div class="legend-color" style="background: #999;"></div><div class="legend-text"></div></div><div class="legend-item"><div class="legend-color" style="background: #bbb;"></div><div class="legend-text"></div></div></div></div>
                </div>
                <div class="table-section">
                    <span class="badge" style="top: 10px; right: 10px;">(13)</span>
                    <div class="chart-header"><div class="chart-icon"></div><div class="chart-title" style="width: 200px;"></div></div>
                    <div class="table-header"><div class="table-header-cell"></div><div class="table-header-cell" style="width: 60%;"></div><div class="table-header-cell" style="width: 50%;"></div></div>
                    <div class="table-row"><div class="table-cell" style="width: 80%;"></div><div class="table-cell" style="width: 60%;"></div><div class="table-cell" style="width: 40%;"></div></div>
                    <div class="table-row"><div class="table-cell" style="width: 80%;"></div><div class="table-cell" style="width: 60%;"></div><div class="table-cell" style="width: 40%;"></div></div>
                    <div class="table-row"><div class="table-cell" style="width: 80%;"></div><div class="table-cell" style="width: 60%;"></div><div class="table-cell" style="width: 40%;"></div></div>
                    <div class="table-row"><div class="table-cell" style="width: 80%;"></div><div class="table-cell" style="width: 60%;"></div><div class="table-cell" style="width: 40%;"></div></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
